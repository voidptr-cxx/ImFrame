name: CI

on:
  push:
    branches: ["develop", "feature/**", "fix/**", "chore/**", "docs/**"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-latest
            compiler: clang
            cc: clang-17
            cxx: clang++-17
          - os: windows-latest
            compiler: msvc
            cc: ""
            cxx: ""
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "6fad4fa784ab2506e35144a7c3d64738976445ea"

      # ── Linux: headless OpenGL via Mesa software renderer ────────────────────
      - name: Install display and OpenGL dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgl1-mesa-swrast libglx-mesa0

      - name: Configure (non-MSVC)
        if: matrix.compiler != 'msvc'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DIMF_BUILD_TESTS=ON \
            -DIMF_BACKEND_GLFW_OPENGL3=ON

      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DIMF_BUILD_TESTS=ON `
            -DIMF_BACKEND_GLFW_OPENGL3=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # ── Test (Linux — headless via Xvfb + Mesa SW) ───────────────────────────
      - name: Test (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run --auto-servernum ctest --test-dir build -C Release --output-on-failure

      # ── Test (macOS / Windows — native OpenGL) ───────────────────────────────
      - name: Test (macOS / Windows)
        if: matrix.os != 'ubuntu-latest'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: API leak check
        shell: bash
        run: bash scripts/check_api_leaks.sh

      - name: clang-format check
        if: matrix.compiler == 'clang' && matrix.os == 'ubuntu-latest'
        run: |
          find include src Backends Examples -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format-17 --dry-run --Werror
